services:
  db:
    build: .
    container_name: db_gimnasio
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data #aloja físicamente la base de datos.
      - ./init_db:/docker-entrypoint-initdb.d #carpeta: Docker lee todos los scripts .sql
      - backup_data:/backup_data #volumen que guarda los respaldos físicos 
      - wal_archive_data:/wal_archive
    # PARA EL ARCHIVADO WAL
    #Agrega la extensión shared_preload_libraries='pg_stat_statements para que el exporter tenga métricas que leer
    command: postgres -c shared_preload_libraries='pg_stat_statements' -c log_min_duration_statement=500 -c archive_mode=on -c archive_command='test ! -f /wal_archive/%f && cp %p /wal_archive/%f' -c wal_level=replica
    restart: unless-stopped

volumes:
  postgres_data:
  backup_data:
    external: true
  wal_archive_data:
    external: true