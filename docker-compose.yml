services:
  db:
    build: .
    container_name: db_gimnasio
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
      - backup_data:/backup_data
      - wal_archive_data:/wal_archive
    # PARA EL ARCHIVADO WAL:
    command: postgres -c archive_mode=on -c archive_command='test ! -f /wal_archive/%f && cp %p /wal_archive/%f' -c wal_level=replica
    restart: unless-stopped

volumes:
  postgres_data:
  backup_data:
    external: true
  wal_archive_data: